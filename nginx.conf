# Konfigurasi Nginx untuk SAVESPEECH Frontend (Phase 10: Production Deployment)
# Menangani Single Page Application (SPA) routing, kompresi Gzip, dan keamanan HTTP header

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Pengaturan kompresi Gzip untuk mempercepat muatan aset statis
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml
        font/woff2;

    # Header keamanan HTTP dasar (NFR-03 & Security Best Practices)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Caching aset terkompilasi Vite (chunk JS, CSS, Font, SVG)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Penanganan rute sisi klien (Client-Side Routing / React Router)
    # Arahkan seluruh rute URL ke index.html agar tidak menghasilkan error 404 saat F5 refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tangani halaman error HTTP standar
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
